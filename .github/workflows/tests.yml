name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # same version as the Dockerfile
          cache: pip

      # requirements.txt only: the corrective-RAG tests use a stub LLM and a fake
      # retriever, so they need neither FAISS/torch (requirements-ml.txt) nor an API key.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
